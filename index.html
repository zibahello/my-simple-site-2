<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سایت ساده من</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap');
    body {
      font-family: 'Vazirmatn', sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(to bottom, #f9fafb, #e5e7eb);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      border: 1px solid #d1d5db;
    }
    h1 {
      color: #1e3a8a;
      font-size: 28px;
      margin-bottom: 1rem;
    }
    p {
      font-size: 18px;
      color: #374151;
      margin-bottom: 2rem;
    }
    button {
      padding: 0.6rem 1.2rem;
      border: none;
      background: #1e3a8a;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #374151;
    }
    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #1e3a8a;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      font-size: 15px;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <main>
    <h1>سلام زیبا 👋</h1>
    <p>این یک سایت استاتیک ساده برای دیپلوی روی Vercel است.</p>
    <button id="btn">کلیک کن</button>
  </main>

  <div id="notif" class="notification">
    ✨ این پیام توسط سایت <strong>Vercel</strong> گفته شده است ✨
  </div>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      const notif = document.getElementById('notif');
      notif.style.display = 'block';
      setTimeout(() => {
        notif.style.display = 'none';
      }, 4000); // نمایش به مدت ۴ ثانیه
    });
  </script>
</body>
</html>
